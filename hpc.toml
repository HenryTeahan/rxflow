[paths]
ligands_csv = "ligands.csv"
source = "hpc_tm_seeds"
results = "hpc_tm_results"

[executables]
mpirun_exe = "/software/kemi/openmpi/openmpi-4.1.1/bin/mpirun"
mpirun_fallback_exe = "/usr/lib64/openmpi/bin/mpirun"
singlepoint_orca_exe = "/groups/kemi/julius/orca_6_1_0/orca"
orca_exe = "${ORCA_EXE}"
external_exe = "${ORCA_EXTERNAL_TOOLS}"
xtb_exe = "${XTB_EXE}"

[sampling]
endpoint_conformers = 20
coembed_conformers = 10
ts_candidates = 5
seed = 12345

[calculation]
solvent = "h2o"
cpus = 1
memory_mb = 2000
opt_attempts = 2
ts_attempts = 2
neb_fallback = true
timeout_seconds = 86400
