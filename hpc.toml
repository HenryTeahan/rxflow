[paths]
ligands_csv = "ligands.csv"
source = "hpc_seeds"
results = "hpc_results"

[executables]
orca_exe = "${ORCA_EXE}"
external_exe = "${ORCA_EXTERNAL_TOOLS}"
xtb_exe = "${XTB_EXE}"

[sampling]
endpoint_conformers = 3
coembed_conformers = 10
seed = 12345

[calculation]
solvent = "h2o"
cpus = 1
memory_mb = 2000
max_iterations = 100
ts_attempts = 2
neb_fallback = true
timeout_seconds = 86400
