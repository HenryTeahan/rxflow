# Start with an existing plotted system. Repeat for the other system configs.
[paths]
results = "Ni_hpc_results"
source = "Ni_hpc_seeds"
references = "solution_references"

[uma]
# Separate output. Defaults to paths.results/uma when omitted.
results = "Ni_hpc_results/uma"
model_label = "UMA" # Set the precise model/protocol when the UMA instructions arrive.
orca_exe = "${ORCA_EXE}"
external_exe = "${ORCA_UMA_EXTERNAL_TOOLS}"
# Arguments for your ORCA external-method wrapper, not gxTB arguments.
# These are deliberately left configurable until the UMA setup is specified.
external_params = []
# Include the lowest precursor/acid/base species used in balanced diagrams.
include_balanced_references = true
gpus_per_task = 1 # Set 0 for a CPU allocation; select CPU in your wrapper as well.
time = "24:00:00"
# partition = "your_gpu_partition"
# account = "your_account"

[uma.calculation]
cpus = 1
memory_mb = 8000
opt_attempts = 2
ts_attempts = 2
neb_fallback = true
timeout_seconds = 86400

[sampling]
ts_conformers = 20
prune_rmsd = 0.5
seed = 12345
